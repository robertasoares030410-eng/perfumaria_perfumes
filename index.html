<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="product-card">
    <!-- Lado da Imagem -->
    <div class="product-image">
      <img src="image-product-desktop.jpg" alt="Perfume Gabrielle Chanel">
    </div>

    <!-- Lado do Conteúdo -->
    <div class="product-content">
      <span class="category">P E R F U M E</span>
      
      <h1>Gabrielle Chanel Eau De Parfum</h1>
      
      <p class="description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
      </p>
      
      <div class="price-box">
        <span class="current-price">R$149.99</span>
        <span class="old-price">R$169.99</span>
      </div>
      
      <button class="btn-cart">
        <img src="images/icon-cart.svg" alt="Ícone de carrinho">
        Add to cart
      </button>
    </div>
  </main>

</body>
</html>
